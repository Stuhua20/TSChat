[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "TSChat: a Text-to-SQL assistant using LangGraph + MCP"
requires-python = ">=3.10,<3.14"
dependencies = [
    "sqlglot>=27.29.0",
    "python-dotenv>=1.2.1,<2",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "mcp>=1.26,<2",
    "fastmcp==3.0.0",
    "mcp2cli>=3,<4",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2.0.28,<3",
    "bcrypt>=4,<6",
    "plotly>=5.18,<7",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.9"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = "src"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.package-data]
"texttosql.evaluation" = ["*.json"]
